# Big-Fat-Matrix-List: rectangular matrices in size band rectangular565bit.
# Binned by column count (input width).

GF283.MUL:
  canonical_name: ["GF(2²⁸³)", "multiplication by x"]
  rows: 283
  cols: 565
  year: [2000, 2013]
  cipher: false
  origin: "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-4.pdf"
  note: "Multiplication by x over the field named next, as the reduction of a product of two field elements. Reduction polynomial of the NIST-recommended binary curve of this degree, FIPS 186-4, Appendix D."
  formula: "Companion matrix of multiplication-by-x in GF(2^283) = GF(2)[x] / (p(x)) where p(x) is the irreducible degree-283 polynomial specified for variant 0. The matrix M is rectangular (283 x 565): the j-th column (j=0..2n-2) is the bit-vector of x^j mod p(x). Equivalently, multiplication of two GF(2^n) elements a, b can be written as a column from M selected by the bits of b XOR-ed together."
