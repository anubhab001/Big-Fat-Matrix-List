# Big-Fat-Matrix-List: rectangular matrices in size band rectangular511bit.
# Binned by column count (input width).

GF256.MUL:
  canonical_name: ["GF(2²⁵⁶)", "multiplication by x"]
  rows: 256
  cols: 511
  year: [1998]
  cipher: false
  origin: "https://www.hpl.hp.com/techreports/98/HPL-98-135.pdf"
  note: "Multiplication by x over the field named next, as the reduction of a product of two field elements. Lowest-weight irreducible polynomial of this degree, as tabulated by Seroussi, Table of Low-Weight Binary Irreducible Polynomials, HP Laboratories technical report HPL-98-135."
  formula: "Companion matrix of multiplication-by-x in GF(2^256) = GF(2)[x] / (p(x)) where p(x) is the irreducible degree-256 polynomial. The matrix M is rectangular (256 x 511): the j-th column (j=0..2n-2) is the bit-vector of x^j mod p(x). Equivalently, multiplication of two GF(2^n) elements a, b can be written as a column from M selected by the bits of b XOR-ed together."
  rank: 256
  hamming_weight: 1298
