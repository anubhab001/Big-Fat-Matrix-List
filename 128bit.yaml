AETHER:
  canonical_name: ["AETHER", "MatrixMul"]
  size: 128
  year: [2025]
  cipher: true
  origin: "https://tches.iacr.org/index.php/TCHES/article/view/12228"
  note: "Full MatrixMul of AETHER: the 128-bit state is split into two sets of 16 nibbles and the same matrix M_b is applied to each. Matrix body omitted; fully reconstructible from AETHER.MB. The nibble permutation of the inner function is AETHER.PN in permutations.yaml."
  augmentation: "block_diag(kron(AETHER.MB, I_4), kron(AETHER.MB, I_4))"
  involution: true
  symmetric: true
  rank: 128
  is_invertible: true
  order: 2

