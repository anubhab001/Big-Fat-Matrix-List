AETHER:
  canonical_name: ["AETHER", "MatrixMul"]
  rows: 128
  cols: 128
  year: [2025]
  cipher: true
  origin: "https://tches.iacr.org/index.php/TCHES/article/view/12228"
  note: "Full MatrixMul of AETHER: the 128-bit state is split into two sets of 16 nibbles and the same matrix M_b is applied to each. Matrix body omitted; fully reconstructible from AETHER.MB. The nibble permutation of the inner function is AETHER.PN in permutations.yaml. The same matrix as ARIA.128 up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
