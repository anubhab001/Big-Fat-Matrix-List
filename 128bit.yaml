BEANIE.MIXCOLUMNST:
  canonical_name: ["BEANIE", "MixColumnsT"]
  rows: 128
  cols: 128
  year: [2025]
  cipher: true
  origin: "https://tosc.iacr.org/index.php/ToSC/article/view/12610"
  paper_title: "Gerhalter, Hodzic, Medwed, Nageler, Folwarczny, Nikov, Hoogerbrugge, Schneider, McConville, Eichlseder. BEANIE, a 32-bit cipher for cryptographic mitigations against software attacks (IACR Transactions on Symmetric Cryptology 2025(4))."
  note: "MixColumnsT of the BEANIE tweakey schedule, which applies the M' matrix of PRINCE to each half of the 128-bit state. The T of the name stands for tweakey, as the specification writes it, and not for transpose: BEANIE names its whole tweakey path that way, SubCellsT, ShiftRowsT and MixColumnsT. The MixColumns of the data path is a different matrix, the involutory 4 x 4 over GF(2^4) held as JPST17.IS16. The same matrix as SPOOK.DBOX up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
