MERIDIAN.MIX:
  canonical_name: ["MERIDIAN", "Mix"]
  rows: 128
  cols: 128
  year: [2026]
  cipher: false
  origin: "https://eprint.iacr.org/2026/856"
  paper_title: "MERIDIAN: a toroid-inspired permutation block cipher for constrained environments (IACR ePrint 2026/856)."
  note: "The third stage of the MERIDIAN diffusion, and the only part of the cipher that is a matrix rather than a permutation. Each column is mixed on its own, so the layer is four copies of a 32 x 32 block over the whole state. Every row and every column has weight three, which is what the design gets instead of an MDS multiplication: it spreads a byte over three rows of its column and reaches the whole state in three rounds. The substitution stage rotates by an amount taken from neighbouring bytes and the key mixing gates the key through an AND, so neither of it is linear and neither is catalogued."
  formula: "Mix(S)[i, j] = S[i, j] XOR S[i+1, j] XOR ROL3(S[i+2, j]), the row index modulo 4 and ROL3 a rotation of the byte left by three."
