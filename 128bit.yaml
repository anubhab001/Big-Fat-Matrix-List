AES.SHIFTROWMIXCOLUMN:
  canonical_name: ["AES", "MixColumns ∘ ShiftRows"]
  rows: 128
  cols: 128
  year: [1998, 2001]
  cipher: true
  origin: "https://csrc.nist.gov/pubs/fips/197/final"
  paper_title: "Daemen & Rijmen, Rijndael (FIPS 197)"
  note: "128x128 GF(2) matrix obtained by composing MixColumns (block_diag of four AES.MIXCOLUMN copies) with the ShiftRows bit-permutation."
  formula: "Composition of MixColumns and ShiftRows on the AES state: M = block_diag(AES.MIXCOLUMN, AES.MIXCOLUMN, AES.MIXCOLUMN, AES.MIXCOLUMN) * AES.SHIFTROW. AES.SHIFTROW is applied first (right-multiplication on input vector), then four independent copies of the 32x32 AES MixColumn matrix act on the four AES columns."
  augmentation: "block_diag(AES.MIXCOLUMN, AES.MIXCOLUMN, AES.MIXCOLUMN, AES.MIXCOLUMN) * AES.SHIFTROW"
  involution: false
  symmetric: false
  rank: 128
  is_invertible: true
