# Big-Fat-Matrix-List: bit-permutation catalogue.
# Each entry maps source bit index i to destination bit index P[i].
# Convention: bit indexing is 0-based; output[P[i]] = input[i].

PRESENT.PERM64:
  canonical_name: "PRESENT pLayer (64-bit)"
  size: 64
  year: [2007]
  origin: "https://link.springer.com/chapter/10.1007/978-3-540-74735-2_31"
  note: "Bogdanov, Knudsen, Leander, Paar, Poschmann, Robshaw, Seurin, Vikkelsoe (CHES 2007). For i in 0..62, P[i] = (16 * i) mod 63; P[63] = 63."
