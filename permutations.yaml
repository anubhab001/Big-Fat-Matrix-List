AETHER.PN:
  canonical_name: ["AETHER", "Pₙ"]
  size: 128
  year: [2025]
  cipher: true
  origin: "https://tches.iacr.org/index.php/TCHES/article/view/12228"
  note: "Nibble permutation of the AETHER inner function, expanded to the 128 state bits: nibble x is moved to nibble position P_n(x), so bit 4x+b goes to bit 4*P_n(x)+b. The nibble-level map is [0,16,1,17,2,18,...,15,31]."
  formula: "P_n interleaves the two halves of the 32 nibbles: P_n(x) = 2x for x < 16 and P_n(x) = 2(x-16)+1 for x >= 16."
