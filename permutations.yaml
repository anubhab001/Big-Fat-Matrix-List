# Big-Fat-Matrix-List: bit-permutation catalogue.
# Each entry maps source bit index i to destination bit index P[i].
# Convention: bit indexing is 0-based; output[P[i]] = input[i].

AES.SHIFTROWS:
  canonical_name: ["AES", "ShiftRows"]
  aliases: ["AES.SHIFTROW"]
  reuse: ["DEOXYS.SHIFTROWS", "VISTRUTAH.SHIFTROWS", "ZIPAES.SHIFTROWS"]
  size: 128
  year: [1998, 2001]
  cipher: true
  origin: "https://csrc.nist.gov/pubs/fips/197/final"
  paper_title: "Daemen & Rijmen, Rijndael (FIPS 197)"
  note: "ShiftRows of AES, which moves whole bytes of the state and so is a bit permutation of the 128 bits. Row r is rotated left by r bytes, the state being filled column by column. The 128 x 128 matrix is the permutation matrix of this tuple and the loader builds it on demand, so it is not stored a second time. The ZIP construction runs a cipher forward and its inverse backward and adds the two, so it carries this layer over unchanged rather than defining one of its own."
  formula: "Byte b of the state, at row b mod 4 and column floor(b / 4), moves to column (floor(b / 4) - (b mod 4)) mod 4 of the same row."
  involution: false
  order: 4
  inversion: 3840
