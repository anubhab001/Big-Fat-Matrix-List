  paper_title: "Jean, Nikolic, Peyrin. Joltik v1.3, submission to the CAESAR competition."
  note: "The nibble permutation of the Joltik-BC tweakey schedule, applied to each 64-bit tweakey word every round. The 16 nibbles are numbered down the columns, so nibble 4c + r sits at row r and column c. It is the same table of sixteen cells that Deoxys-TBC prints for DEOXYS.H, the permutation of the TWEAKEY framework the two share; the cell is a nibble here and a byte there, so the two bit permutations are of different sizes and neither is a copy of the other. The field multiplication the schedule applies after it acts on each nibble separately and is not part of this permutation. The MixColumns of the two is not shared either: JOLTIK is involutory over GF(2^4), while Deoxys takes the AES matrix over GF(2^8)."
