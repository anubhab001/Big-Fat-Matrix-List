KECCAK.200:
  canonical_name: ["Keccak-f[200]", "θ"]
  rows: 200
  cols: 200
  year: [2015]
  cipher: false
  origin: "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.202.pdf"
  paper_title: "Bertoni, Daemen, Peeters, Van Assche. The Keccak reference; standardised as FIPS 202."
  note: "The theta step of Keccak-f[200], the lane being 8 bits long. Every row has weight 11, a bit being added to the two column parities beside it. The rest of the linear layer, rho and pi, permutes the bit positions, so the full layer is a row permutation of this matrix and carries the same row multiset."
  formula: "A'[x, y, z] = A[x, y, z] + sum_y' A[x-1, y', z] + sum_y' A[x+1, y', z-1], with bit index 8 * (5y + x) + z."
