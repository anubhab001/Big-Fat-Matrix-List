# Big-Fat-Matrix-List: matrices in size band 1280bit.
# Binned by column count (input width).

ICEPOLE:
  canonical_name: ["ICEPOLE", "linear layer"]
  rows: 1280
  cols: 1280
  year: [2014]
  cipher: true
  origin: "https://eprint.iacr.org/2014/266"
  paper_title: "Morawiecki, Gaj, Homsirikamol, Pieprzyk, Rogawski, Srebrny, Wojcik. ICEPOLE: High-speed Hardware-oriented Authenticated Encryption (CHES 2014)."
  note: "Full ICEPOLE-128 linear layer over GF(2). Acts on 4*5*64 = 1280 state bits. Matrix body intentionally omitted; structure is fully captured by ICEPOLE.SLICE."
  formula: "Full ICEPOLE-128 linear diffusion. The state is a 4 x 5 x 64 array a[r][s][z]; the linear layer factorises as ICEPOLE.SLICE (kron) I_64 since each z-slice is mixed independently using the same 20x20 lane mixer."
  augmentation: "kron(ICEPOLE.SLICE, I_64)"
  involution: false
  symmetric: false
  rank: 1280
  is_invertible: true
