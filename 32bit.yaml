AES.MIXCOLUMNS:
  canonical_name: ["AES", "MixColumns"]
  aliases: ["AES.MIXCOLUMN"]
  reuse: ["DEOXYS.MIXBYTES", "ZIPAES.MIXCOLUMNS"]
  rows: 32
  cols: 32
  year: [1998, 2001]
  cipher: true
  origin: "https://csrc.nist.gov/projects/cryptographic-standards-and-guidelines/archived-crypto-projects/aes-development"
  source: "NIST Circuit Complexity: https://csrc.nist.gov/Projects/circuit-complexity/list-of-circuits"
  note: "Daemen-Rijmen, Rijndael / FIPS-197. The NIST Circuit Complexity project files this matrix together with Square and MUGI; the name each of it gives the layer is not recorded there. The ZIP construction runs a cipher forward and its inverse backward and adds the two, so it carries this layer over unchanged rather than defining one of its own. Deoxys-TBC states of its MixBytes that the MDS matrix it uses is the one from AES."
  formula: "GF(2)-linearisation of multiplication by the polynomial c(x) = 03*x^3 + 01*x^2 + 01*x + 02 in GF(2^8)[x] / (x^4 + 1) acting on a 4-byte column. Each output byte is a fixed GF(2)-linear function of the 4 input bytes; the 32x32 matrix is block-circulant with 8x8 blocks corresponding to multiplication by 02, 03, 01, 01 in GF(2^8) under the AES irreducible polynomial x^8 + x^4 + x^3 + x + 1."
  involution: false
  symmetric: false
  rank: 32
  invertible: true
  order: 4
  hamming_weight: 184
  orbit: 8
