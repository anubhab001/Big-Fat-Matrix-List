  note: "L2 of ZUC, the XOR of a 32-bit word rotated left by 0, 8, 14, 22 and 30. It is the transpose of L1 of the same cipher, whose offsets are 0, 2, 10, 18 and 24, the negatives of these modulo 32; L1 in turn is the L of SM4, which is where the catalogue holds its body. A rotation matrix and its transpose are the two readings of one set of offsets, so the pair is a property of how ZUC is written rather than of two different maps. The same matrix as SM4 up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
