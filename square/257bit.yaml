SUBTERRANEAN.THETA:
  canonical_name: ["Subterranean", "θ"]
  rows: 257
  cols: 257
  year: [2020]
  cipher: true
  origin: "https://tosc.iacr.org/index.php/ToSC/article/view/8622"
  paper_title: "Daemen, Massolino, Mehrdad, Rotella. The Subterranean 2.0 Cipher Suite; IACR ToSC 2020, Special Issue 1."
  note: "The theta step of Subterranean 2.0, the mixing step of a round that is otherwise chi, a constant and a bit shuffle. Every row has weight 3, which is what the paper means by a lightweight mapping with a heavy inverse: it is cheap forward and dense backward. The state is one-dimensional, unlike the Keccak and Xoodoo thetas the catalogue holds beside it, which work on a state of planes."
  formula: "s_i <- s_i + s_{i+3} + s_{i+8}, the indices modulo 257, so every row has weight 3 and the matrix is a circulant."
