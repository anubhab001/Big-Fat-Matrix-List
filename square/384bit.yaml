XOODOO.THETA:
  canonical_name: ["Xoodoo", "θ"]
  rows: 384
  cols: 384
  year: [2018]
  cipher: true
  origin: "https://doi.org/10.46586/tosc.v2018.i4.1-38"
  paper_title: "Daemen, Hoffert, Van Assche, Van Keer. The design of Xoodoo and Xoofff; IACR ToSC 2018 (4). Xoodyak, built on it, was a finalist of the NIST lightweight process."
  note: "The theta step of Xoodoo, which adds to every plane a function of the parity of the three. Every row has weight 7: a bit is added to the parity of its own column and of two others. It is the same idea as the theta of Keccak, which the catalogue holds as KECCAK.1600 and its narrower relatives, on a state of three planes rather than five; unlike that one it is not a row permutation of a smaller matrix. It is invertible, of rank 384, which was computed here."
  formula: "P = A0 + A1 + A2, then E = P <<< (1, 5) + P <<< (1, 14), then Ay = Ay + E for each of the three planes. A rotation by (i, j) moves the bit at lane x and position z to lane x + i modulo 4 and position z + j modulo 32, and bit (y, x, z) of the state is numbered 128y + 32x + z."
  involution: false
  symmetric: false
  rank: 384
  invertible: true
  order: 32
  hamming_weight_per_row: [7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7]
