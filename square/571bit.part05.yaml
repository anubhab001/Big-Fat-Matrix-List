# Big-Fat-Matrix-List: matrices in size band 571bit (part 5 of 12).
# Binned by column count (input width).

GF571.SQR2:
  canonical_name: ["GF(2⁵⁷¹)", "Matrix_2_2"]
  rows: 571
  cols: 571
  year: [2025]
  cipher: false
  origin: "https://github.com/starj1023/Binary_ECC"
  paper_title: "Jang, Srivastava, Baksi, Sarkar, Seo. Quantum Circuits for Binary Elliptic Curves Cryptography (IACR Transactions on Cryptographic Hardware and Embedded Systems 2025)."
