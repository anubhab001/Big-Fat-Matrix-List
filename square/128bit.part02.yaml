  paper_title: "Dinu, Perrin, Udovenko, Velichkov, Grossschadl, Biryukov. Design Strategies for ARX with Provable Bounds: SPARX and LAX (ASIACRYPT 2016)."
  note: "The linear layer of SPARX-128, mixing the 4 branches of its 128-bit state at the end of each step. The state is 8 words of 16 bits, word w holding bits 16w to 16w + 15 with the most significant first. The round function beside it is a keyless round of SPECK-32, which adds modulo 2^16 and is not linear over GF(2); the key schedule adds as well, so neither is catalogued. Transcribed from the reference implementation and checked against the inverse it publishes."
  formula: "Branch halves are XORed with the rotation by 8 of the XOR of the left halves, then the branches are swapped; see the reference implementation for the exact order."
