SPOOK.DBOX:
  canonical_name: ["Spook", "Shadow-512 D"]
  rows: 128
  cols: 128
  year: [2020]
  cipher: true
  origin: "https://tosc.iacr.org/index.php/ToSC/article/view/8623"
  note: "Diffusion layer of Shadow-512: the Midori near-MDS involutory 4x4 binary matrix applied across the four bundles on 32-bit words, i.e. kron(M4, I_32). Branch number 4 (an MDS diffusion would give 5); six 32-bit XORs at gate depth 2. Spook v2 replaces it by an MDS matrix of Duval-Leurent type. The same matrix as BEANIE.MIXCOLUMNST up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
  formula: "(a,b,c,d) = M4 (w,x,y,z) with 32-bit words and M4 = [[0,1,1,1],[1,0,1,1],[1,1,0,1],[1,1,1,0]]; on bits, kron(M4, I_32)."
