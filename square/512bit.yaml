# Big-Fat-Matrix-List: matrices in size band 512bit.
# Binned by column count (input width).

SPARKLE.L512:
  canonical_name: ["Sparkle", "ℒ8"]
  rows: 512
  cols: 512
  year: [2019, 2021]
  cipher: true
  origin: "https://csrc.nist.gov/CSRC/media/Projects/lightweight-cryptography/documents/finalist-round/updated-spec-doc/sparkle-spec-final.pdf"
  paper_title: "Beierle, Biryukov, Cardoso dos Santos, Großschädl, Perrin, Udovenko, Velichkov, Wang. Sparkle, the submission to the NIST lightweight process, version 1.2."
  note: "The diffusion layer of the Sparkle permutation at 512 bits, the one of its parts that is linear over GF(2). Alzette, the ARX-box beside it, adds modulo a power of two and has no matrix. The specification writes l two ways, as a rotation exclusive-ored with a masked copy and as a shift folded back, and states plainly that l(y || z) = z || (y + z); the third form is the one built here, the other two agreeing with it."
  formula: "A Feistel round on 8 branches of two 32-bit words. The parity of the left half is taken word by word and passed through l, where l(y || z) = z || (y + z) on the two halves of a word; each right branch then takes the matching left branch and that value. The right half is rotated one branch to the left and the halves are swapped. Bit 64i + k is word x of branch i below 32 and word y of it above."
  involution: false
  symmetric: false
  rank: 512
  invertible: true
  order: 12
