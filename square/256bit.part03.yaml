  note: "The 8-fold squaring over GF(2^233), array Matrix_2_8 of the binary-curve elliptic-curve work of Jang et al., used in its Itoh-Tsujii inversion. Binary_ECC stores the array with its columns reversed, entry (output j, input k) at index 233 j + 232 - k as its Sqr_x233.py reads it, and it is held here the right way round. It is GF233.SQR raised to the power 8, checked here."
