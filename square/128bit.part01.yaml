  year: [2025]
  cipher: false
  origin: "https://doi.org/10.1007/978-3-031-91104-9"
  source: "URL: https://github.com/Shuo-peng/chilow; URL: https://tosc.iacr.org/index.php/ToSC/article/view/12786"
  paper_title: "Belkheyar, Derbez, Ghosh, Leander, Mella, Perrin, Rasoolzadeh, Stennes, Sun, Van Assche, Vizar. ChiLow and ChiChi: new constructions for code encryption (EUROCRYPT 2025)."
  note: "The 128-bit linear layer of ChiLow-(32 + tau), which alternates it with a chi-based non-linear layer. Every row has weight three, so the depth is two XOR gates, which is what this cipher is built for. The index map is affine, i mapping to 17i + b, rather than a rotation, so the matrix is not circulant; it is invertible because 17 is prime to 128, and the rank was checked. The constants are read from the implementation that Peng, Cube and Integral Attacks on ChiLow-32 (IACR Transactions on Symmetric Cryptology 2026) publishes, which `source` points at, rather than from the specification; the structure agrees with what that paper states of it."
  formula: "y[i] = x[(17i + 7) mod 128] XOR x[(17i + 11) mod 128] XOR x[(17i + 14) mod 128]."
