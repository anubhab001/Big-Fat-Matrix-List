UKNIT.L8:
  canonical_name: ["uKNIT-BC", "L₈"]
  rows: 64
  cols: 64
  year: [2025]
  cipher: false
  origin: "https://tosc.iacr.org/index.php/ToSC/article/view/13006"
  source: "https://github.com/syllab-ntu/UKNIT"
  paper_title: "Hu, Khairallah, Peyrin, Tan. uKNIT: breaking round-alignment for cipher design, featuring uKNIT-BC (IACR Transactions on Symmetric Cryptology)."
  note: "Linear layer of round 8 of uKNIT-BC. The cipher gives every round a layer of its own rather than repeating one, so eleven are catalogued for its twelve rounds. Each row has weight three and the layer is invertible. Every row and every column carrying weight three is a design constraint rather than an accident: it fixes the depth of the layer at two XOR gates, which is what a low-latency cipher is after. The eleven layers are one matrix up to a permutation of rows and columns, and so is the M-prime of PRINCE; that follows from how the search generated it, the search having started from the matrices of PRINCE and Midori and mutated it by swapping rows and columns within groups of four indices, which cannot leave the class it starts in. What differs from round to round is which wire goes where, and it is the composition of consecutive rounds that the design is built to vary. The same matrix as PRINCE.MPRIME, UKNIT.L0, UKNIT.L1, UKNIT.L10, UKNIT.L2, UKNIT.L3, UKNIT.L4, UKNIT.L5, UKNIT.L6, UKNIT.L7, UKNIT.L9 up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
  formula: "Sparse 64 x 64 binary matrix; row i has ones in the three columns the specification tabulates for it."
  involution: false
  symmetric: false
  rank: 64
  invertible: true
  hamming_weight: 192
