  note: "The 64-bit linear layer of ChiLow-(32 + tau), which alternates it with a chi-based non-linear layer. Every row has weight three, so the depth is two XOR gates, which is what this cipher is built for. The index map is affine, i mapping to 3i + b, rather than a rotation, so the matrix is not circulant; it is invertible because 3 is prime to 64, and the rank was checked. The constants are read from the implementation that Peng, Cube and Integral Attacks on ChiLow-32 (IACR Transactions on Symmetric Cryptology 2026) publishes, which `source` points at, rather than from the specification; the structure agrees with what that paper states of it."
