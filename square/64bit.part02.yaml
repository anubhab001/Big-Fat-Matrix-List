PHOTON.P288:
  canonical_name: ["PHOTON", "P₂₈₈"]
  rows: 48
  cols: 48
  year: [2011]
  cipher: true
  origin: "https://doi.org/10.1007/978-3-642-22792-9_13"
  paper_title: "Guo, Peyrin, Poschmann. The PHOTON Family of Lightweight Hash Functions; CRYPTO 2011."
  note: "MixColumnsSerial of the PHOTON permutation P288, applied to each column of 6 cells of 8 bits. The serial form is what makes the layer cheap: one cell is updated per step and the column shifts, so the hardware holds one row rather than the matrix. The paper states that every one of these layers is MDS, and the branch number was computed here to confirm it rather than taken on trust. PHOTON-Beetle of the NIST lightweight process uses P256. The layer is built out of field operations the catalogue holds in their own right: multiplication by x over this field is GF256.MUL and squaring is GF256.SQR, and every coefficient of A is a power of the first. A corpus that files those multiplications under PHOTON_1, PHOTON_2 and so on is naming the field rather than the layer, which is why no such key is here."
  formula: "M = A^6 over GF(2^8) modulo x^8 + x^4 + x^3 + x + 1, the AES one, where A is Serial(2, 3, 1, 2, 1, 4), the matrix that replaces the last cell of a column by that combination of all 6 of it and rotates the column up. Each field element of A^6 is written out as its 8 x 8 multiplication matrix."
