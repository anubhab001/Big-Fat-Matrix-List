  paper_title: "Canale, Guneysu, Leander, Thoma, Todo, Ueno. SCARF - a low-latency block cipher for secure cache randomization (USENIX Security 2023)."
  note: "Linear layer of the SCARF tweakey schedule, acting on the 60-bit expanded tweak. Circulant with 7 taps (each output bit is the sum of 7 input bits, 8 including the key XOR, so the critical path is an XOR tree of depth 3). Word-wise branch number 8 over 5-bit words, as required by the design criteria. The companion bit permutation is SCARF.PI."
