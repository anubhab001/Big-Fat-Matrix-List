# Big-Fat-Matrix-List: rectangular matrices in size band rectangular2047bit (part 1 of 6).
# Binned by column count (input width). The part of a band is
# loaded and merged by bigfatmatrix.py; a matrix whose body spans
# several parts carries matrix_part / matrix_parts markers.

GF1024.MUL:
  canonical_name: ["GF(2¹⁰²⁴)", "multiplication by x"]
  rows: 1024
  cols: 2047
  year: [1998]
  cipher: false
  origin: "https://www.hpl.hp.com/techreports/98/HPL-98-135.pdf"
  note: "Multiplication by x over the field named next, as the reduction of a product of two field elements. Lowest-weight irreducible polynomial of this degree, as tabulated by Seroussi, Table of Low-Weight Binary Irreducible Polynomials, HP Laboratories technical report HPL-98-135."
  formula: "Companion matrix of multiplication-by-x in GF(2^1024) = GF(2)[x] / (p(x)) where p(x) is the irreducible degree-1024 polynomial. The matrix M is rectangular (1024 x 2047): the j-th column (j=0..2n-2) is the bit-vector of x^j mod p(x). Equivalently, multiplication of two GF(2^n) elements a, b can be written as a column from M selected by the bits of b XOR-ed together."
