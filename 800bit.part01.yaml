# Big-Fat-Matrix-List: matrices in size band 800bit (part 1 of 2).
# Binned by column count (input width).

KECCAK.800:
  canonical_name: ["Keccak-f[800]", "θ"]
  rows: 800
  cols: 800
  year: [2015]
  cipher: false
  origin: "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.202.pdf"
  paper_title: "Bertoni, Daemen, Peeters, Van Assche. The Keccak reference; standardised as FIPS 202."
  note: "The theta step of Keccak-f[800], the lane being 32 bits long. Every row has weight 11, a bit being added to the two column parities beside it. The rest of the linear layer, rho and pi, permutes the bit positions, so the full layer is a row permutation of this matrix and carries the same row multiset."
  formula: "A'[x, y, z] = A[x, y, z] + sum_y' A[x-1, y', z] + sum_y' A[x+1, y', z-1], with bit index 32 * (5y + x) + z."
  involution: false
  symmetric: false
  rank: 800
  invertible: true
  order: 96
