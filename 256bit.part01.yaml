GLEEOK.THETA256B2:
  canonical_name: ["Gleeok-256", "θ₂"]
  rows: 256
  cols: 256
  year: [2024]
  cipher: true
  origin: "https://tches.iacr.org/index.php/TCHES"
  paper_title: "Anand, Isobe, Liu, Rahman, Sakamoto et al. Gleeok: a family of low-latency PRFs (IACR Transactions on Cryptographic Hardware and Embedded Systems)."
  note: "Subterranean-style 3-input-XOR linear map of Branch2 of Gleeok-256. Circulant with row weight 3; the linear layer of a round is pi o theta, where pi is the bit permutation x_i <- x_{85 i mod 256} catalogued as GLEEOK.PI256B2. The same matrix as GLEEOK.THETA256B1 up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
  formula: "x_i <- x_{i+2} + x_{i+90} + x_{i+179} (indices mod 256)."
