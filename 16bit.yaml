AETHER.MB:
  canonical_name: ["AETHER", "M_b"]
  rows: 16
  cols: 16
  year: [2025]
  cipher: true
  origin: "https://tches.iacr.org/index.php/TCHES/article/view/12228"
  paper_title: "Banik, Isobe, Rahman, Sakamoto et al. AETHER (IACR Transactions on Cryptographic Hardware and Embedded Systems)."
  note: "MatrixMul of the AETHER inner function. Involutory 16x16 binary matrix over nibbles taken from Akleylek, Rijmen, Sakalli, Ozturk (2017); block form [[I,I,I,J],[I,I,J,I],[I,J,I,I],[J,I,I,I]] over 4x4 blocks, J the all-ones block. Applied to each of the two halves of the 128-bit state; on bits the half-state map is kron(AETHER.MB, I_4). See AETHER for the full 128-bit layer. The same matrix as ARIA up to a permutation of rows and columns, so a circuit for one is a circuit for the other once the wires are renamed. Neither specification says so; it is established here."
  formula: "(x0, ..., x15)^T <- M_b (x0, ..., x15)^T over 16 nibbles; entries of M_b are in GF(2), so on bits M_b acts as kron(M_b, I_4)."
  involution: true
  symmetric: true
  rank: 16
  invertible: true
  order: 2
  hamming_weight: 112
  orbit: 8
  similarity: ["ARIA"]
  trivium: "The aether was the medium that nineteenth-century physics posited for the propagation of electromagnetic waves."
  hamming_weight_per_row: [7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7]
